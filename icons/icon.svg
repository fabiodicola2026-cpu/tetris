<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2a000d"/>
      <stop offset="60%" stop-color="#14000a"/>
      <stop offset="100%" stop-color="#07000a"/>
    </radialGradient>
    <linearGradient id="six" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="50%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ff0033"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <g opacity="0.45" stroke="#ff0033" stroke-width="3" fill="none" transform="translate(256 256)">
    <circle r="180"/>
    <polygon points="0,-170 161.7,52.5 -100,137.5 100,137.5 -161.7,52.5"/>
  </g>
  <g transform="translate(64 96)">
    <rect x="0" y="0" width="64" height="64" fill="#ff0033" stroke="#000" stroke-width="3"/>
    <rect x="64" y="0" width="64" height="64" fill="#ff7a18" stroke="#000" stroke-width="3"/>
    <rect x="128" y="0" width="64" height="64" fill="#ffcc33" stroke="#000" stroke-width="3"/>
    <rect x="192" y="0" width="64" height="64" fill="#3399ff" stroke="#000" stroke-width="3"/>
    <rect x="256" y="0" width="64" height="64" fill="#cc00ff" stroke="#000" stroke-width="3"/>
    <rect x="320" y="0" width="64" height="64" fill="#33ff66" stroke="#000" stroke-width="3"/>
  </g>
  <text x="256" y="370" text-anchor="middle"
        font-family="Georgia, serif" font-weight="900" font-size="240"
        fill="url(#six)" filter="url(#glow)" letter-spacing="-8">666</text>
